services:
  sldp-back:
    build: ./back
    container_name: sldp-back
    restart: always
    env_file:
      - ./back/.env.release
    volumes:
      - ./back/logs:/app/logs
    networks:
      - app_net
      - infra_net
  slms:
    build: ./slms-web
    container_name: slms
    restart: always
    networks:
      - app_net

  ng-back:
    image: nginx:1.25-alpine
    container_name: ng-back
    volumes:
      - ./back/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks:
      - app_net
    depends_on:
      - sldp-back
      - slms

networks:
  app_net:
    external: true
  infra_net:
    external: true
